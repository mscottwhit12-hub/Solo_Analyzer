name: Build executables

# Runs on every push to main (download from the Actions tab),
# and publishes a GitHub Release when you push a tag like v1.0.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SoloAnalyzer-windows.exe
          - os: macos-latest
            asset: SoloAnalyzer-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          pyinstaller solo_analyzer.py
          --name SoloAnalyzer
          --onefile
          --windowed
          --noconfirm
          --collect-data librosa
          --collect-all imageio_ffmpeg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/SoloAnalyzer.exe ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SoloAnalyzer.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
