name: Build executables

# Runs on every push to main (download from the Actions tab),
# and publishes a GitHub Release when you push a tag like v1.0.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SoloAnalyzer-windows.exe
          - os: macos-latest
            asset: SoloAnalyzer-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller SoloAnalyzer.spec --noconfirm

      - name: Verify bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyi-archive_viewer -l -r dist/SoloAnalyzer.exe > contents.txt
          grep -iE "portaudio|ffmpeg" contents.txt
          grep -q "libportaudio" contents.txt || { echo "::error::PortAudio missing from build"; exit 1; }
          grep -qE "imageio_ffmpeg.binaries.ffmpeg" contents.txt || { echo "::error::ffmpeg missing from build"; exit 1; }

      - name: Verify bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          find dist/SoloAnalyzer.app -name "libportaudio*" | grep -q . || { echo "::error::PortAudio missing from build"; exit 1; }
          find dist/SoloAnalyzer.app -path "*imageio_ffmpeg/binaries/ffmpeg*" | grep -q . || { echo "::error::ffmpeg missing from build"; exit 1; }
          plutil -p dist/SoloAnalyzer.app/Contents/Info.plist | grep -q NSMicrophoneUsageDescription || { echo "::error::Info.plist missing mic permission text"; exit 1; }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/SoloAnalyzer.exe ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SoloAnalyzer.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
